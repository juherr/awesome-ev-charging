name: tests

# The CSMS catalogue enforces invariants that only hold if something checks
# them: a controlled feature vocabulary, a source URL behind every curated
# feature, and a deterministic render. The suite also covers pipeline.py's
# classification layer — the refresh guard and what enrich caches. It needs no
# network and no secret: it validates the committed CSVs, renders from in-memory
# fixtures, and stubs the classifier backends.
#
# Every pull request runs the suite, with no `paths:` filter. The link test
# (tests/test_markdown_links.py) checks that each Markdown link resolves to a
# tracked path, and any tracked path can be a link target: a PR that renames
# or deletes a PDF, an image or a directory breaks a link without touching a
# single Markdown file. No path list can name every target in advance, and a
# filtered run would only catch the breakage on main, after the merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise (Python 3.11 + venv)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install Python dependencies
        run: mise run install-dev

      - name: Run tests
        run: mise run test
