name: Monthly metadata refresh

# Re-runs the awesome-ev-charging pipeline (ingest -> enrich -> render) once a
# month and opens a PR with the regenerated listing. Enrichment is incremental:
# it reuses classifications.csv (committed) keyed by pushed_at, so only repos
# whose upstream changed since the last run are re-classified via Copilot.
# The same run also re-mirrors the Open Charge Alliance CSMS certificate
# registry (csms.py fetch -> render), which needs no LLM and no secret.
#
# Auth: no secret needed. Since 2026-07-02 the Copilot CLI authenticates in
# Actions with the built-in GITHUB_TOKEN, provided the job grants the
# `copilot-requests: write` permission below. The same token drives the GitHub
# API for ingest (public data only). Requires Copilot CLI usage to be enabled
# for the account/org that owns this repo (Copilot AI credits are billed there).
#
# Fallback (only if the built-in token is rejected — e.g. Copilot-in-CLI not
# enabled for this account): create a fine-grained PAT with the "Copilot
# Requests" ACCOUNT permission (token Permissions → Account tab → Add
# permissions → Copilot Requests), store it as a secret, and expose it on the
# enrich step as COPILOT_GITHUB_TOKEN (it takes precedence over GITHUB_TOKEN).

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

# One refresh at a time; a new run cancels an in-flight one.
concurrency:
  group: metadata-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write # lets the Copilot CLI authenticate with GITHUB_TOKEN

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job refreshes the published listing, which lives on main —
          # workflow_dispatch can be fired from any branch, and taking that
          # branch's tree would fold its unrelated changes into the refresh PR.
          ref: main
          # Full history: the "Fast-forward onto the current main" step below
          # needs a real merge base, which a shallow clone cannot give it.
          fetch-depth: 0

      - name: Set up mise (Python 3.11 + venv)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Python dependencies
        run: mise run install

      - name: Set up Node (for the Copilot CLI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Ingest — fetch repos + signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run ingest

      - name: Enrich — classify changed repos via Copilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise exec -- python pipeline.py enrich \
            --token "$GH_TOKEN" \
            --in repos.csv --out repos.enriched.csv \
            --classifier copilot

      - name: Render — inject listing into README + standalone
        run: mise exec -- python pipeline.py render --readme README.md

      # The OCA registry is scraped from an undocumented endpoint, so `fetch`
      # refuses to write a mirror that is short or smaller than the committed
      # one. That guard lives in csms.py, which knows both counts — so it also
      # protects local runs, and it fires before `render` can consume bad data.
      #
      # Both steps are non-blocking: the CSMS catalogue is secondary to the
      # project listing, and a registry outage must not cost the whole monthly
      # refresh. If either fails, the next step restores both files so the PR
      # never carries a new mirror alongside a table rendered from the old one.
      - name: CSMS — refresh the OCA certificate mirror
        id: csms_fetch
        continue-on-error: true
        run: mise exec -- python csms.py fetch --out csms-certificates.csv

      - name: CSMS — re-render csms.md
        id: csms_render
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- python csms.py render --token "$GH_TOKEN"

      - name: Drop partial CSMS changes if either step failed
        if: steps.csms_fetch.outcome == 'failure' || steps.csms_render.outcome == 'failure'
        run: |
          echo "::warning::CSMS refresh failed — leaving the committed catalogue untouched."
          git checkout -- csms-certificates.csv csms.md csms-features.md

      # The PR branch is cut from the *local* main — the tree checked out when
      # the job started, up to half an hour earlier — and pushed with the
      # built-in GITHUB_TOKEN, which GitHub refuses to let create or update
      # anything under .github/workflows/. So if a workflow edit lands on main
      # while this run is classifying, the branch carries the older copy,
      # GitHub reads that as an App modifying a workflow, and rejects the push
      # after the whole Copilot run has already been paid for (that is what
      # killed run 33614981892). Fast-forward onto the current main first,
      # setting the generated files aside across the merge.
      - name: Fast-forward onto the current main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Local base already matches origin/main."
            exit 0
          fi
          echo "::warning::main moved while this run was working — fast-forwarding onto it."
          if git stash push --message refresh-artifacts | grep -q "Saved working directory"; then
            git merge --ff-only origin/main
            git stash pop
          else
            git merge --ff-only origin/main
          fi

      # Guardrail: a Copilot failure can return an empty category for a repo.
      # Don't let that regression reach a PR. The comparison is per repo, not by
      # count: a newly discovered repo with no README arrives without a category
      # and never had one to lose, so it only warns.
      #
      # It runs *after* the fast-forward above, not before: the baseline is
      # `git show HEAD:classifications.csv`, so it has to read the base the PR
      # will actually be opened against. Judging the run against a main that
      # has since moved is how a regression slips through — and if main gained
      # classifications while this run was working, dropping them is exactly
      # the regression this guard exists to catch.
      - name: Guard against classification regressions
        run: |
          git show HEAD:classifications.csv \
            | mise exec -- python pipeline.py check-classifications --base -

      - name: Open / update the refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Built-in GITHUB_TOKEN — scopes the PR to this repo. PRs opened with
          # it don't trigger further workflows, which avoids CI loops here.
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/monthly-metadata-refresh
          # git-ignored artifacts (repos.csv, repos.enriched.csv, cache_github/)
          # are never staged, so only the published files land in the PR.
          add-paths: |
            classifications.csv
            README.md
            legacy-projects.md
            csms-certificates.csv
            csms.md
            csms-features.md
          commit-message: |
            chore(data): monthly listing refresh

            Automated ingest + enrich + render, plus the OCA CSMS mirror.
            Refreshes repos whose upstream metadata (stars, pushed_at,
            dormant/archived) changed this month.
          title: "chore(data): monthly listing refresh"
          body: |
            Automated monthly metadata refresh (`ingest → enrich → render`), plus a
            refresh of the OCA CSMS certificate mirror (`csms fetch → render`).

            Only repos whose upstream `pushed_at` changed since the last run were
            re-classified (Copilot); the rest were reused from
            `classifications.csv`. Review the diff — broad reshuffling between the
            Selection / Dormant / To refine blocks is expected as stars and
            dormancy shift, not a bug.
          labels: automated, data-refresh
          delete-branch: true
