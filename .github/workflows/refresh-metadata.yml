name: Monthly metadata refresh

# Re-runs the awesome-ev-charging pipeline (ingest -> enrich -> render) once a
# month and opens a PR with the regenerated listing. Enrichment is incremental:
# it reuses classifications.csv (committed) keyed by a hash of what the
# classifier is shown (description, topics, truncated README), so only repos
# whose prompt actually changed are re-classified via Copilot.
# The same run also re-mirrors the Open Charge Alliance CSMS certificate
# registry (csms.py fetch -> render), which needs no LLM and no secret.
#
# Auth: no secret needed. Since 2026-07-02 the Copilot CLI authenticates in
# Actions with the built-in GITHUB_TOKEN, provided the job grants the
# `copilot-requests: write` permission below. The same token drives the GitHub
# API for ingest (public data only). Requires Copilot CLI usage to be enabled
# for the account/org that owns this repo (Copilot AI credits are billed there).
#
# Fallback (only if the built-in token is rejected — e.g. Copilot-in-CLI not
# enabled for this account): create a fine-grained PAT with the "Copilot
# Requests" ACCOUNT permission (token Permissions → Account tab → Add
# permissions → Copilot Requests), store it as a secret, and expose it on the
# enrich step as COPILOT_GITHUB_TOKEN (it takes precedence over GITHUB_TOKEN).

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC
  # Manual runs from the Actions tab. The inputs serve the run that follows an
  # edit to the taxonomy or the classifier instructions: that edit makes every
  # cached signature stale, and `--restamp` keeps the answers it cannot have
  # changed, re-asking only the catch-all buckets it split. The scheduled run
  # leaves them empty and behaves as before.
  workflow_dispatch:
    inputs:
      restamp:
        description: "Keep stale cached answers (enrich --restamp)"
        type: boolean
        default: false
      reask_categories:
        description: "With restamp: buckets to re-ask, ';'-separated (e.g. OCPP > Misc; iso15118 > Misc)"
        type: string
        default: ""

# One refresh at a time; a new run cancels an in-flight one.
concurrency:
  group: metadata-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write # lets the Copilot CLI authenticate with GITHUB_TOKEN

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A normal run classifies a handful of repos and finishes in minutes. The
    # budget is sized for the rare run that classifies all ~530: editing the
    # taxonomy or the classifier contract invalidates every cache entry at
    # once, and at ~7s a call that is an hour of Copilot.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job refreshes the published listing, which lives on main —
          # workflow_dispatch can be fired from any branch, and taking that
          # branch's tree would fold its unrelated changes into the refresh PR.
          ref: main
          # Full history: the "Fast-forward onto the current main" step below
          # needs a real merge base, which a shallow clone cannot give it.
          fetch-depth: 0

      - name: Set up mise (Python 3.11 + venv)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install Python dependencies
        run: mise run install

      - name: Set up Node (for the Copilot CLI)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Ingest — fetch repos + signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run ingest

      - name: Enrich — classify changed repos via Copilot
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never interpolated into the script: the input is free text.
          RESTAMP: ${{ inputs.restamp }}
          REASK_CATEGORIES: ${{ inputs.reask_categories }}
        run: |
          args=()
          if [ "$RESTAMP" = "true" ]; then args+=(--restamp); fi
          # A re-ask without --restamp is left for argparse to reject.
          IFS=';' read -ra buckets <<< "$REASK_CATEGORIES"
          for bucket in "${buckets[@]}"; do
            bucket="$(echo "$bucket" | xargs)"
            if [ -n "$bucket" ]; then args+=(--reask-category "$bucket"); fi
          done
          mise exec -- python pipeline.py enrich \
            --token "$GH_TOKEN" \
            --in repos.csv --out repos.enriched.csv \
            --classifier copilot "${args[@]}"

      # The CSMS steps run before the project render because both renders
      # write data/manifest.json, each refreshing its own entry. The drop
      # step below restores the manifest from HEAD on a CSMS failure; run
      # after the project render, it would erase the projects entry that
      # render had just written.
      #
      # The OCA registry is scraped from an undocumented endpoint, so `fetch`
      # refuses to write a mirror that is short or smaller than the committed
      # one. That guard lives in csms.py, which knows both counts — so it also
      # protects local runs, and it fires before `render` can consume bad data.
      #
      # Both steps are non-blocking: the CSMS catalogue is secondary to the
      # project listing, and a registry outage must not cost the whole monthly
      # refresh. If either fails, the next step restores the mirror, both
      # Markdown views and the CSMS export (data/csms.json, data/manifest.json)
      # so the PR never carries a new mirror alongside a table or an export
      # rendered from the old one.
      - name: CSMS — refresh the OCA certificate mirror
        id: csms_fetch
        continue-on-error: true
        run: mise exec -- python csms.py fetch --out csms-certificates.csv

      - name: CSMS — re-render csms.md + data/csms.json
        id: csms_render
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- python csms.py render --token "$GH_TOKEN" --export-dir data

      - name: Drop partial CSMS changes if either step failed
        if: steps.csms_fetch.outcome == 'failure' || steps.csms_render.outcome == 'failure'
        run: |
          echo "::warning::CSMS refresh failed — leaving the committed catalogue untouched."
          git checkout -- csms-certificates.csv csms.md csms-features.md \
            data/csms.json data/manifest.json

      # After the CSMS steps (see above): adds its own `projects` entry to the
      # manifest the CSMS render left, or restored.
      - name: Render — inject listing into README + standalone + data/projects.json
        run: mise exec -- python pipeline.py render --readme README.md --export-dir data

      # The PR branch is cut from the *local* main — the tree checked out when
      # the job started, up to half an hour earlier — and pushed with the
      # built-in GITHUB_TOKEN, which GitHub refuses to let create or update
      # anything under .github/workflows/. So if a workflow edit lands on main
      # while this run is classifying, the branch carries the older copy,
      # GitHub reads that as an App modifying a workflow, and rejects the push
      # after the whole Copilot run has already been paid for (that is what
      # killed run 33614981892). Fast-forward onto the current main first,
      # setting the generated files aside across the merge.
      - name: Fast-forward onto the current main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Local base already matches origin/main."
            exit 0
          fi
          echo "::warning::main moved while this run was working — fast-forwarding onto it."
          if git stash push --message refresh-artifacts | grep -q "Saved working directory"; then
            git merge --ff-only origin/main
            git stash pop
          else
            git merge --ff-only origin/main
          fi

      # Guardrail: a Copilot failure can return an empty category for a repo,
      # or drop a protocol category. Don't let either regression reach a PR.
      # The comparison is per repo, not by count: a newly discovered repo with
      # no README arrives without a category and never had one to lose, so it
      # only warns. A protocol lost on the rendered page (after overrides) with
      # no reviewed exception fails; masked and accepted losses are reported.
      #
      # It also writes a Markdown report, before any failure, which the next
      # steps put in the job summary and the PR body. The baseline
      # data/projects.json adds selection / dormant / to_refine movements to
      # it; until one is committed (#98) the report says they were not
      # reported, so the flag is only passed when HEAD holds the file and
      # `git show` can read it. The movements are informational: a baseline
      # that cannot be read from HEAD is a warning and the run goes on
      # without the flag; a missing fresh export or an unreadable file is a
      # warning and a report line. None of them is ever a failure.
      #
      # pipefail: without it a failing `git show` would feed an empty baseline,
      # every repo would read as a newcomer and the guard would pass green.
      #
      # It runs *after* the fast-forward above, not before: the baseline is
      # `git show HEAD:classifications.csv`, so it has to read the base the PR
      # will actually be opened against. Judging the run against a main that
      # has since moved is how a regression slips through — and if main gained
      # classifications while this run was working, dropping them is exactly
      # the regression this guard exists to catch.
      - name: Guard against classification regressions
        id: guard
        run: |
          set -o pipefail
          args=(--base - --report "$RUNNER_TEMP/classification-report.md")
          base_projects="$RUNNER_TEMP/base-projects.json"
          if git cat-file -e HEAD:data/projects.json 2>/dev/null; then
            if git show HEAD:data/projects.json > "$base_projects"; then
              args+=(--base-projects "$base_projects")
            else
              echo "::warning::Could not read data/projects.json from HEAD; curation movements are not reported."
              rm -f "$base_projects"
            fi
          fi
          git show HEAD:classifications.csv \
            | mise exec -- python pipeline.py check-classifications "${args[@]}"

      # The report matters most when the guard blocked the run, so publish it
      # whatever the outcome, as long as the guard got far enough to write it.
      - name: Publish the classification report
        if: always()
        run: |
          report="$RUNNER_TEMP/classification-report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      # GitHub caps a PR body at 65,536 characters; create-pull-request
      # truncates a longer body itself (with a warning), so a report that
      # follows a full re-classification still opens the PR.
      - name: Build the refresh PR body
        run: |
          {
            cat <<'EOF'
          Automated monthly metadata refresh (`ingest → enrich → render`), plus a
          refresh of the OCA CSMS certificate mirror (`csms fetch → render`).
          Both renders also regenerate the public JSON export under `data/`
          (`projects.json`, `csms.json`, `manifest.json`).

          Only repos whose classifier inputs (description, topics, README)
          changed since the last run were re-classified (Copilot); the rest
          were reused from `classifications.csv`. Review the diff — broad reshuffling between the
          Selection / Dormant / To refine blocks is expected as stars and
          dormancy shift, not a bug. The classification report below lists
          what changed, raw and as rendered.

          The checks on this PR wait for approval: it was opened with the
          built-in `GITHUB_TOKEN`, so GitHub creates its workflow runs as
          `action_required`. Click **Approve workflows to run** in the merge
          box before reviewing.

          EOF
            cat "$RUNNER_TEMP/classification-report.md"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open / update the refresh PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # Built-in GITHUB_TOKEN — scopes the PR to this repo. GitHub does not
          # run the PR's checks unattended when this token opened or updated
          # it: the pull_request runs are created in an approval-required state
          # (shown as `action_required`, no job executed) until someone with
          # write access clicks "Approve workflows to run" in the merge box, or
          # pushes to the branch. That is what prevents CI loops; a PAT or a
          # GitHub App token would let the checks run on their own.
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/monthly-metadata-refresh
          # git-ignored artifacts (repos.csv, repos.enriched.csv, cache_github/)
          # are never staged, so only the published files land in the PR.
          add-paths: |
            classifications.csv
            README.md
            legacy-projects.md
            csms-certificates.csv
            csms.md
            csms-features.md
            data/**
          commit-message: |
            chore(data): monthly listing refresh

            Automated ingest + enrich + render, plus the OCA CSMS mirror
            and the public JSON export under data/.
            Refreshes repos whose upstream metadata (stars, pushed_at,
            dormant/archived) changed this month.
          title: "chore(data): monthly listing refresh"
          # Static text + the classification report, built in the step above.
          body-path: ${{ runner.temp }}/pr-body.md
          labels: automated, data-refresh
          delete-branch: true
